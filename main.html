<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootcamp project</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="main">
            <div id="logo">
        <img id="mainLogo" src="assets/Vector.svg" alt="Brand Logo">
        <span id="brand-name">RedSeam Clothing</span>
            </div>  
              <div id="nav-right">
  <button class="icon-btn">
    <img src="assets/shopping-cart.svg" alt="Cart">
  </button>

  
</div>
    </nav>
   <nav id="nav-secondary">
  <h2 id="products-title">Products</h2>

  <div id="products-controls">
    <span id="results-info"></span>
     <div id="divider"></div>

    <button id="btn-filter">
      <img src="assets/adjustments-horizontal.svg" alt="">
      Filter
    </button>
      
   

<div id="filter-panel" hidden>
  <h4>Select price</h4>

  <div class="filter-inputs">
    <input type="number" id="price-from" placeholder="From *">
    <input type="number" id="price-to" placeholder="To *">
  </div>

  <button id="apply-filter">Apply</button>
</div>

    <div id="sort">
  <span id="sort-label">Sort by</span>
  <img src="assets/chevron-down.svg" alt="">
  <div id="sort-panel" hidden>
    <h4>Sort by</h4>
    <button class="sort-option" data-sort="created_at" data-order="desc">New products first</button>
    <button class="sort-option" data-sort="price" data-order="asc">Price, low to high</button>
    <button class="sort-option" data-sort="price" data-order="desc">Price, high to low</button>
  </div>
</div>
    </div>
  </div>
</nav>
<div class="full-containers">
  
</div>
<footer id="footer">
  <div id="pagination">
    <button class="page-btn prev">&lt;</button>
    <button class="page-btn active">1</button>
    <button class="page-btn">2</button>
    <span class="dots">...</span>
    <button class="page-btn">9</button>
    <button class="page-btn">10</button>
    <button class="page-btn next">&gt;</button>
  </div>
</footer>
<script src="app.js"></script>
<script type="module" src="js/api.js"></script>
<script type="module" src="js/products.js"></script>
</body>

</html>
