<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootcamp project</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
    <nav>
            <div id="logo">
        <img id="mainLogo" src="assets/Vector.svg" alt="Brand Logo">
        <span>RedSeam Clothing</span>
            </div>  
            <div id="logIn">
        <img id="mainLogo" src="assets/Union.svg" alt="Log In">
        <span>Log In</span>        
            </div>
    </nav>
    <main id="login-page">
        <img id="mainPhoto" src="assets/Rectangle 10.svg" alt="">
        <div id="registration-container">
  <h2 id="registration-title">Registration</h2>

  <div id="avatar-row">
    <img id="avatar" src="" alt="User avatar" style="display:none;">
    <div>
        <input type="file" id="avatarInput" accept="image/*" hidden>
      <button type="button" class="link-btn" id="uploadBtn">Upload new</button>
      <button  type="button" class="link-btn" id="removeBtn">Remove</button>
    </div>
  </div>

  <form id="registration-form">
    <input type="text" id="reg-username" placeholder="Username *" required>
    <p id="username-error" class="error" hidden>Username must be at least 3 characters.</p>
    <input type="text" id="reg-email" placeholder="Email *" required>
    <p id="email-error" class="error" hidden>Invalid email format.</p>
    <div class="input-wrapper">
      <input type="password"
       id="password1" 
        name="password"
         placeholder="Password *"
          required
           aria-describedby="pw-error">
      <img id="togglePass1" src="assets/eye.png" alt="">
      <p id="pw-error" class="error" hidden>Password must be at least 3 characters.</p>
      </div>
    <div class="input-wrapper">
    <input type="password"
       id="password2" 
        name="password"
         placeholder="Confirm password *"
          required
           aria-describedby="pw-error">
      <img id="togglePass2" src="assets/eye.png" alt="">
      <p id="confirm-error" class="error" hidden>Passwords do not match.</p>
      </div>

    <button type="submit" id="btn-register">Register</button>

    <p id="login-text">
      Already member? <a href="index.html" id="login-link">Log in</a>
    </p>
  </form>
</div>
   





    <script src="app.js"></script>
    <script type="module" src="js/api.js"></script>
    <script type="module" src="js/registration.js"></script>
</body>

</html>
