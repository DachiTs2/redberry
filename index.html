<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootcamp project</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
    <nav>
            <div id="logo">
        <img id="mainLogo" src="assets/Vector.svg" alt="Brand Logo">
        <span>RedSeam Clothing</span>
            </div>  
            <div id="logIn">
        <img id="mainLogo" src="assets/Union.svg" alt="Log In">
        <span>Log In</span>        
            </div>
    </nav>
    <main id="login-page">
        <img id="mainPhoto" src="assets/Rectangle 10.svg" alt="">
        <div id="login-container">
            <h2 id="login-title">Log in</h2>
            <form id="login-form">
    <!-- email / username -->
    <div class="input-group">
      <input type="email"
       id="username"
        name="username"
         placeholder="Email or username *"
          required 
           aria-describedby="email-error">
    </div>
    <p id="email-error" class="error" hidden>
    Invalid email address. Please try again.
  </p>
     <!-- password with eye icon -->
    <div class="input-group">
      <input type="password"
       id="password" 
        name="password"
         placeholder="Password *"
          required
           aria-describedby="pw-error">
      <img id="togglePassword" src="assets/Vector.png" alt="">
    </div>
    <p id="pw-error" class="error" hidden>
    Incorrect password. Please try again.
  </p>
    <button type="submit" id="btn-login">Log in</button>
            <p id="register-text">
      Not a member? <a href="#" id="register-link">Register</a>
    </p>
  </form>
</div>
        </div>
    </main>
   





    <script src="app.js"></script>
</body>
</html>
