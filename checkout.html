<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  <div id="logo">
    <img id="mainLogo" src="assets/Vector.svg" alt="Brand Logo">
    <span id="brand-name">RedSeam Clothing</span>
  </div>
  <div id="nav-right">
    <button class="icon-btn">
      <img src="assets/shopping-cart.svg" alt="Cart">
    </button>
  </div>
</nav>

  
  <main class="checkout-page">
    <h1 id="checkout-title">Checkout</h1>

    <div class="checkout-grid">
      
      <section class="checkout-form">
        <div class="checkout-mini">
        <h3>Order details</h3>
     <form id="checkout-form">
  <input type="text" placeholder="Name" required>
  <input type="text" placeholder="Surname" required>

  <div class="input-with-icon wide">
  <img src="assets/mail.png" alt="Mail Icon" class="input-icon">
  <input 
    type="email" 
    id="checkout-email" 
    placeholder="Email" 
    required>
</div>

  <input type="text" placeholder="Address" required>
  <input type="text" placeholder="Zip code" required>
</form>
<p id="checkout-error" class="error" hidden>
  Please fill all the fields.
</p>
</div>
      </section>

      <!-- RIGHT: Cart Summary -->
       
      <aside class="checkout-summary">
        <div class="summary-items" id="summary-items">
          
        </div>
     <div class="summary-totals">
  <div class="row"><span>Items subtotal</span><span id="sum-subtotal">$0</span></div>
  <div class="row"><span>Delivery</span><span id="sum-delivery">$5</span></div>
  <div class="row total"><strong>Total</strong><strong id="sum-total">$0</strong></div>
</div>
        <button id="btn-pay">Pay</button>
      </aside>
    </div>
  </main>

  <script src="app.js"></script>
  <script type="module" src="js/api.js"></script>
  <script type="module" src="js/cart.js"></script>
  <script type="module" src="js/checkout.js"></script>
</body>
</html>
