<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootcamp project</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body class="product-page-body">
    <nav>
            <div id="logo">
        <img id="mainLogo" src="assets/Vector.svg" alt="Brand Logo">
        <span id="brand-name">RedSeam Clothing</span>
            </div>  
              <div id="nav-right">
  <button class="icon-btn">
    <img src="assets/shopping-cart.svg" alt="Cart">
  </button>
</div>
</nav>

<main class="product-page">
    <p class="listing">Listing / Product</p>
  <div class="gallery">
    <div class="thumbnails">
      <img src="" alt="">
      <img src="" alt="">
      <img src="" alt="">
      <img src="" alt="">
      <img src="" alt="">
    </div>
    <div class="main-image">
      <img src="" alt="">
    </div>
  </div>

  <div class="product-info">
    <h1></h1>
    <p class="price"></p>

<div class="color-picker">
  <span id="color-label">Color:</span>
  <div id="color-options"></div>
</div>

  <div class="size-picker">
  <span id="size-label">Size:</span>
  <div id="size-options"></div>
</div>

   <div class="quantity">
  <span>Quantity:</span>
  <select id="qty-select">
    <option>1</option>
    <option>2</option>
    <option>3</option>
  </select>
</div>

    <button class="add-to-cart">
  <img src="assets/shopping-cart.svg" alt="Cart Icon">
  Add to cart
</button>
<div class="details-row">
  <div class="details-left">
    <h3>Details</h3>
    <p><strong>Brand:</strong> <span id="brand-text"></span></p>
    <p id="product-description"></p> 
  </div>
  <div class="details-logo">
    <img src="" alt="Brand Logo" id="brand-logo">
  </div>
</div>
  </div>
</main>

<div class="rs-backdrop" id="rs-backdrop"></div>

<aside class="rs-cart" id="rs-cart">
  <div class="rs-cart__header">
    <h3>Shopping cart (<span id="rs-cart-count">0</span>)</h3>
    <button id="rs-cart-close" aria-label="Close cart">&times;</button>
  </div>

  <div class="rs-cart_ _items" id="rs-cart-items">
    
  </div>

<div class="rs-cart__footer" id="rs-cart-footer">
  <div class="rs-row"><span>Items subtotal</span><span id="rs-subtotal">$0</span></div>
  <div class="rs-row"><span>Delivery</span><span id="rs-delivery">$5</span></div>
  <div class="rs-row rs-total"><strong>Total</strong><strong id="rs-total">$5</strong></div>
  <button id="rs-checkout">Go to checkout</button>
</div>
</aside>
<script type="module" src="js/api.js"></script>
<script type="module" src="js/product.js"></script>
<script type="module" src="js/cart.js"></script>
</body>

</html>
